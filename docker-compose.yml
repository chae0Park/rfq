services:

  backend:
    build:
      context: ./backend

    container_name: rfq-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend

    container_name: rfq-frontend

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000

    depends_on:
      - backend

    restart: unless-stopped